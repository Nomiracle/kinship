name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    if: hashFiles('backend/requirements.txt') != ''
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: kinship_archive_test
          MYSQL_USER: archive_app
          MYSQL_PASSWORD: ci-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ARCHIVE_DB_HOST: 127.0.0.1
      ARCHIVE_DB_PORT: 3306
      ARCHIVE_DB_NAME: kinship_archive_test
      ARCHIVE_DB_USER: archive_app
      ARCHIVE_DB_PASSWORD: ci-pass
      # ngram_token_size 默认即 2，与本地生产一致，无需额外配置
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff pytest
      - name: lint
        run: ruff check .
      - name: migrate
        run: alembic upgrade head
        if: hashFiles('alembic.ini') != ''
      - name: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
