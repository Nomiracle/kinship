[project]
name = "kinship-archive"
version = "0.1.0"
description = "Self-hosted, relationship-generic personal archive with reminders"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["frontend", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning"]
